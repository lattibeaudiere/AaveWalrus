version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aave_dataset_db
    environment:
      POSTGRES_DB: aave_dataset
      POSTGRES_USER: aave_user
      POSTGRES_PASSWORD: aave_password_change_me
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aave_user -d aave_dataset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

