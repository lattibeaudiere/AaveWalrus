name: Integration tests (gated)

# This workflow is gated (manual trigger) because it runs against real network
# resources and requires secrets. It is intended to be run manually via
# the GitHub Actions UI (workflow_dispatch) and to use a protected environment
# (see .github/INTEGRATION.md for required secrets and setup).

on:
  workflow_dispatch:

jobs:
  integration:
    name: Run integration tests (manual)
    runs-on: ubuntu-latest
    # Use an environment so repository admins can require reviewers/approvals
    environment: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r storage/requirements.txt pytest

      - name: Run DB migrations (apply SQL files)
        run: |
          echo 'Running migration runner to ensure DB tables exist'
          python3 storage/apply_migrations.py

      - name: Start optional SEAL wrapper (if no SEAL_WRAPPER_URL)
        run: |
          # If SEAL_WRAPPER_URL is provided via secrets, we'll use it. Otherwise start a local wrapper.
          if [ -z "${{ secrets.SEAL_WRAPPER_URL }}" ]; then
            echo 'No SEAL_WRAPPER_URL provided, starting local wrapper in storage/seal_wrapper'
            pushd storage/seal_wrapper
            node --version || (echo 'Node not available, installing' && curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
            npm install
            nohup node index.js > /tmp/seal_wrapper.log 2>&1 &
            # wait for /health
            for i in `seq 1 20`; do
              if curl -sSf http://127.0.0.1:3001/health >/dev/null 2>&1; then
                echo 'Wrapper healthy'
                break
              fi
              sleep 1
            done
            popd
            # Persist wrapper URL for subsequent steps
            echo "SEAL_WRAPPER_URL=http://127.0.0.1:3001" >> $GITHUB_ENV
          else
            echo 'Using provided SEAL_WRAPPER_URL'
            # Persist provided wrapper URL for subsequent steps
            echo "SEAL_WRAPPER_URL=${{ secrets.SEAL_WRAPPER_URL }}" >> $GITHUB_ENV
          fi
      - name: Check SEAL wrapper health
        env:
          SEAL_WRAPPER_URL: ${{ env.SEAL_WRAPPER_URL }}
        run: |
          python -m pytest storage/test_seal_wrapper_health.py -q

      - name: SEAL wrapper /encrypt smoke test
        env:
          SEAL_WRAPPER_URL: ${{ env.SEAL_WRAPPER_URL }}
        run: |
          python -m pytest storage/test_seal_wrapper_encrypt_smoke.py -q

      - name: Run SEAL integration test
        env:
          # Real network settings - MUST be provided via repository secrets
          WALRUS_FAKE: 'false'
          SEAL_ENABLED: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEAL_WRAPPER_URL: ${{ env.SEAL_WRAPPER_URL }}
          # Optional: WALRUS wallet private key or other auth if needed
          WALRUS_WALLET_KEY: ${{ secrets.WALRUS_WALLET_KEY }}
        run: |
          python -m pytest storage/test_seal_integration.py -q
