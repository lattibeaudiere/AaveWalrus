name: Unit tests (fast)

on:
  push:
  pull_request:

jobs:
  test:
    name: Run fast unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r storage/requirements.txt pytest

      - name: Run tests
        env:
          # Use fast, hermetic defaults for unit tests
          WALRUS_FAKE: 'true'
          SEAL_ENABLED: 'false'
        run: |
          python -m pytest -q
